services:
  - type: web
    name: collegegpt-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_PROVIDER
        value: local
      - key: VECTOR_STORE_TYPE
        value: memory
      - key: MONGODB_URI
        sync: false
      - key: RAG_TOP_K
        value: 5
      - key: RAG_MIN_SCORE
        value: 0.10
